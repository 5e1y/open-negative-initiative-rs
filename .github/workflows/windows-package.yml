name: Windows package
# By hand only: a tester's build, the installer and ONI.exe in a zip kept as this run's artifacts for 14 days;
# never a release. `shots` walks the installer and keeps a picture of each page.
on:
  workflow_dispatch:
    inputs:
      shots:
        description: Walk the installer and keep a picture of each page
        type: boolean
        default: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Build
        shell: bash
        # Stamped as scripts/release-build stamps the Mac build, so the update feed compares the same number.
        run: |
          export ONI_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/oni-app/Cargo.toml | head -1)
          export ONI_BUILD=$((10000 + $(git rev-list --count HEAD)))
          echo "$ONI_VERSION (build $ONI_BUILD)"
          cargo build --release -p oni-app --bin oni
      - name: Package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force ONI | Out-Null
          Copy-Item target/release/oni.exe ONI/ONI.exe
          @"
          Open Negative Initiative, test build $sha for Windows 10 and 11 (64-bit).

          Install: unzip this folder anywhere (Documents, Desktop) and double-click ONI.exe. Nothing else
          to install. Windows may say it protected the PC, as the build is not signed: click "More info",
          then "Run anyway". Settings and caches live in %APPDATA%\Open Negative Initiative and
          %LOCALAPPDATA%\Open Negative Initiative; delete the folder and those two to remove it.

          Installation : dézippez ce dossier où vous voulez et double-cliquez sur ONI.exe. Si Windows dit
          avoir protégé l'ordinateur (build non signé), cliquez « Informations complémentaires » puis
          « Exécuter quand même ».
          "@ | Set-Content -Encoding utf8 ONI/README.txt
          Compress-Archive -Path ONI -DestinationPath "ONI-windows-$sha.zip"
      - name: Installer
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = (Select-String -Path crates/oni-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          python -m pip install --quiet pillow
          python packaging/windows/art.py $version "$pwd/art"
          if ($LASTEXITCODE) { exit 1 }
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$version" "/DTag=$version-$sha" "/DArt=$pwd\art" "/DExe=$pwd\target\release\oni.exe" "/DOutput=$pwd" packaging/windows/oni.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ONI-windows
          path: |
            ONI-windows-*.zip
            ONI-setup-*.exe
          retention-days: 14
      - name: Shots
        if: ${{ inputs.shots }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bitmap.Save("shots/$name.png")
          }
          $setup = (Get-ChildItem ONI-setup-*.exe)[0].FullName
          $app = "$env:LOCALAPPDATA\Programs\Open Negative Initiative"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($lang in "fr", "en") {
            $p = Start-Process $setup -ArgumentList "/LANG=$lang", "/LOG=$pwd\shots\setup-$lang.log" -PassThru
            Start-Sleep 8
            # The mode dialog, the welcome, the folder, the tasks and the summary, each passed by Enter.
            for ($i = 1; $i -le 5; $i++) {
              $shell.AppActivate($p.Id) | Out-Null
              Start-Sleep 1
              Shot "$lang-$i"
              $shell.SendKeys("{ENTER}")
              Start-Sleep 5
            }
            for ($t = 0; $t -lt 180 -and -not (Test-Path "$app\unins000.dat"); $t += 2) { Start-Sleep 2 }
            Start-Sleep 5
            $shell.AppActivate($p.Id) | Out-Null
            Shot "$lang-6-finished"
            $shell.SendKeys("{ENTER}")
            Start-Sleep 20
            Shot "$lang-7-app"
            Get-Process ONI, ONI-setup* -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
            Start-Sleep 5
            if (Test-Path "$app\ONI.exe") { Write-Error "the uninstaller left ONI.exe"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.shots }}
        with:
          name: ONI-setup-shots
          path: shots
          retention-days: 14
