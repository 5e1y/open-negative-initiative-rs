name: Windows package
# By hand only: a tester's build, the installer and ONI.exe in a zip kept as this run's artifacts for 14 days;
# never a release. The built app is started and must show its window; `shots` walks the installer's pages.
on:
  workflow_dispatch:
    inputs:
      shots:
        description: Walk the installer and keep a picture of each page
        type: boolean
        default: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Build
        shell: bash
        # Stamped as scripts/release-build stamps the Mac build, so the update feed compares the same number.
        run: |
          export ONI_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/oni-app/Cargo.toml | head -1)
          export ONI_BUILD=$((10000 + $(git rev-list --count HEAD)))
          echo "$ONI_VERSION (build $ONI_BUILD)"
          cargo build --release -p oni-app --bin oni
      - name: Package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force ONI | Out-Null
          Copy-Item target/release/oni.exe ONI/ONI.exe
          @"
          Open Negative Initiative, test build $sha for Windows 10 and 11 (64-bit).

          Install: unzip this folder anywhere (Documents, Desktop) and double-click ONI.exe. Nothing else
          to install. Windows may say it protected the PC, as the build is not signed: click "More info",
          then "Run anyway". Settings and caches live in %APPDATA%\Open Negative Initiative and
          %LOCALAPPDATA%\Open Negative Initiative; delete the folder and those two to remove it.

          Installation : dézippez ce dossier où vous voulez et double-cliquez sur ONI.exe. Si Windows dit
          avoir protégé l'ordinateur (build non signé), cliquez « Informations complémentaires » puis
          « Exécuter quand même ».
          "@ | Set-Content -Encoding utf8 ONI/README.txt
          Compress-Archive -Path ONI -DestinationPath "ONI-windows-$sha.zip"
      - name: Installer
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = (Select-String -Path crates/oni-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          python -m pip install --quiet pillow
          python packaging/windows/art.py $version "$pwd/art"
          if ($LASTEXITCODE) { exit 1 }
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$version" "/DTag=$version-$sha" "/DArt=$pwd\art" "/DExe=$pwd\target\release\oni.exe" "/DOutput=$pwd" packaging/windows/oni.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ONI-windows
          path: |
            ONI-windows-*.zip
            ONI-setup-*.exe
          retention-days: 14
      - name: Launch
        shell: powershell
        # The built app started as a person starts it, until its window answers through the accessibility
        # tree; a support folder of its own, marked launched at this version, so it sends no install ping.
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          New-Item -ItemType Directory -Force launch | Out-Null
          $version = (Select-String -Path crates/oni-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $support = Join-Path $env:RUNNER_TEMP 'oni-launch'
          New-Item -ItemType Directory -Force $support | Out-Null
          [System.IO.File]::WriteAllText("$support\preferences.json", (@{ lastLaunchedVersion = $version } | ConvertTo-Json))
          $env:ONI_SUPPORT = $support
          $app = Start-Process target\release\oni.exe -PassThru
          $AE = [System.Windows.Automation.AutomationElement]
          $mine = New-Object System.Windows.Automation.PropertyCondition($AE::ProcessIdProperty, $app.Id)
          $named = New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Settings')
          $key = $null
          for ($t = 0; $t -lt 120 -and -not $key -and -not $app.HasExited; $t += 2) {
            Start-Sleep 2
            foreach ($w in $AE::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $mine)) { if (-not $key) { $key = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $named) } }
          }
          Start-Sleep 5
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bitmap.Save("$pwd\launch\app.png")
          Copy-Item "$support\Logs\oni.log" launch -ErrorAction SilentlyContinue
          if ($app.HasExited) { Write-Error "the app ended at launch, code $($app.ExitCode)"; exit 1 }
          Stop-Process -Id $app.Id -Force
          if (-not $key) { Write-Error "the app's window never showed its keys"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ONI-launch
          path: launch
          retention-days: 14
      - name: Shots
        if: ${{ inputs.shots }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bitmap.Save("shots/$name.png")
          }
          $setup = (Get-ChildItem ONI-setup-*.exe)[0].FullName
          $app = "$env:LOCALAPPDATA\Programs\Open Negative Initiative"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($lang in "fr", "en") {
            $p = Start-Process $setup -ArgumentList "/LANG=$lang", "/LOG=$pwd\shots\setup-$lang.log" -PassThru
            Start-Sleep 8
            # The mode dialog, the welcome, the folder, the tasks and the summary, each passed by Enter.
            for ($i = 1; $i -le 5; $i++) {
              $shell.AppActivate($p.Id) | Out-Null
              Start-Sleep 1
              Shot "$lang-$i"
              $shell.SendKeys("{ENTER}")
              Start-Sleep 5
            }
            for ($t = 0; $t -lt 180 -and -not (Test-Path "$app\unins000.dat"); $t += 2) { Start-Sleep 2 }
            Start-Sleep 5
            # The last page: the wizard, a child process, takes no key once the install runs; Launch checks the app.
            Shot "$lang-6-finished"
            Get-Process ONI, ONI-setup* -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
            Start-Sleep 5
            if (Test-Path "$app\ONI.exe") { Write-Error "the uninstaller left ONI.exe"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.shots }}
        with:
          name: ONI-setup-shots
          path: shots
          retention-days: 14
