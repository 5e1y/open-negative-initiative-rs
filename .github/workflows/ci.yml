name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace
      - name: Render checks
        run: cargo test --release -p oni-render
      - name: Phone link checks
        run: cargo test --release -p oni-link -p oni-localsend -p oni-link-ffi
