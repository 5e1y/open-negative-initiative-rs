name: CI
# Windows only, on every push and pull request: macOS checks run on the owner's Mac.
on:
  push:
  pull_request:
  workflow_dispatch:
# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      # No RAW and no Swift dump is staged on a runner: those checks print SKIPPED and return, and so do
      # the GPU checks where no adapter is found. oni-decode's own check needs a RAW and runs elsewhere.
      - name: Core checks
        env:
          ONI_SKIP_HEAVY: "1"
        run: >-
          cargo test --release --workspace --no-fail-fast
          --exclude oni-link --exclude oni-localsend --exclude oni-link-ffi --exclude oni-link-demo
      - name: Phone link checks
        run: cargo test --release -p oni-link -p oni-localsend -p oni-link-ffi
