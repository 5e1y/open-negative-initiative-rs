[package]
name = "oni-libraw"
description = "LibRaw, vendored at one version and built with every automatic knob pinned, apart from its Rust callers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
oni-hack = { version = "0.1", path = "../oni-hack" }

[build-dependencies]
cc = { version = "1.8.0", features = ["parallel"] }

[lib]
doctest = false
