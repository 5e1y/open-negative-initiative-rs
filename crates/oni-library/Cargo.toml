[package]
name = "oni-library"
description = "The archive of Open Negative Initiative: its folders, rolls, projects, ONI Trash and disposable SQLite index"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
oni-settings.workspace = true
oni-i18n = { path = "../oni-i18n" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
# The opened folder and the listed ones watched: FSEvents on macOS, ReadDirectoryChangesW on Windows.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
oni-hack = { version = "0.1", path = "../oni-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
oni-fixtures.workspace = true

[lib]
doctest = false
