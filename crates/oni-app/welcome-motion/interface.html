<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="/gsap/gsap.min.js"></script>
<script type="module">
// The first gift's film: the interface as it moves. The camera comes close on what the hand does, then draws back
// as the app answers: a photo of the gallery flies into the editor, the editor's photo onto the export's preview,
// then the gallery comes back, where the film began.
import { S, tl, point, about, cut, play, look, reach, press, dissolve, film } from '/takes.js';

const near = about(point('tile'), 620);
const whole = { x: 0, y: 0, w: 1280 };
S.cam = { ...near };
cut('gallery-again', 0);
let t = 0.5;
// Double-click on a photo of the gallery, and it flies into the editor.
reach(point('tile'), t, 0.7);
t += 0.7;
press(t);
press(t + 0.16);
t += 0.2;
const open = play('open', t);
look(whole, t, 1.1);
tl.to(S.hand, { x: '+=90', y: '+=260', duration: 0.6, ease: 'power3.in' }, t + 0.1);
t += open;
cut('editor', t);
t += 0.5;
// Export: the photo moves onto the export's preview.
look(about(point('export'), 640), t, 0.8);
reach(point('export'), t + 0.2, 0.6);
t += 0.85;
press(t);
t += 0.1;
const out = play('export', t);
look(whole, t, 1.0);
tl.to(S.hand, { x: '+=120', y: '+=700', duration: 0.6, ease: 'power3.in' }, t + 0.1);
t += out;
cut('exporting', t);
t += 0.7;
// Back to the gallery, where the film began.
dissolve('gallery-again', 0, t, 0.6);
look(near, t - 0.1, 0.8);
t += 0.9;
film(t);
</script>
</body>
</html>
