<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: ONI; src: url(/fonts/ONISans-Medium.ttf); font-weight: 500; }
  @font-face { font-family: ONI; src: url(/fonts/ONISans-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 800px; height: 500px; overflow: hidden; background: #000; font-family: ONI; color: #f2f2f2; }
  .box { position: absolute; overflow: hidden; background: #050505; }
  .box img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #sweep { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 18px 6px rgba(255,255,255,0.55), 0 0 60px 24px rgba(255,236,210,0.18); }
  #strip { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #strip .frame { position: absolute; top: 0; height: 100%; overflow: hidden; }
  #names { position: absolute; left: 22px; bottom: 18px; height: 20px; overflow: hidden; font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
  #names div { height: 20px; line-height: 20px; white-space: nowrap; text-shadow: 0 1px 14px rgba(0,0,0,0.6); }
  #picker { position: absolute; left: 640px; top: 54px; width: 132px; height: 392px; display: flex; flex-direction: column; gap: 4px; }
  .cell { position: relative; flex: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; }
  .cell .lit { position: absolute; inset: 0; border-radius: 8px; background: rgba(255,255,255,0.09); opacity: 0; }
  .cell img, .cell svg { position: relative; width: 50px; height: 50px; }
  .cell .labels { position: relative; height: 14px; width: 100%; }
  .cell .label { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; font-size: 11px; color: rgba(242,242,242,0.55); white-space: nowrap; }
  .cell .label.on { color: #f2f2f2; opacity: 0; }
  #grid .box { border-radius: 3px; }
  #hand { position: absolute; left: 0; top: 0; width: 22px; height: 28px; }
  #ring { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="box" id="hero">
    <img id="negative" src="/renders/film-negative.jpg">
    <div id="strip"></div>
    <img id="cut">
    <div id="sweep"></div>
    <div id="names"></div>
  </div>
  <div id="picker"></div>
  <div id="hand"><div id="ring"></div>
    <svg viewBox="0 0 22 28" width="22" height="28"><path d="M2 2 L2 22 L7.5 17 L11.5 26 L15 24.5 L11 15.8 L18.5 15.8 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="/gsap/gsap.min.js"></script>
<script>
// The huge gift's film: a negative read by the scanner, the Film panel's picks, every film cut on the beat, then
// the contact sheet; the renders are the photo on each film as the app prints it (`welcome_stills`), hero three first.
const FILMS = [
  ['film-print-1', 'Kodak Ektar 100'], ['film-print-2', 'Fujifilm Velvia 50'], ['film-print-3', 'Kodak Tri-X 400'],
  ['film-print-4', 'Kodak Portra 400'], ['film-print-5', 'Kodak Vision3 500T'], ['film-print-6', 'Kodak Gold 200'],
  ['film-print-7', 'Fujifilm Provia 100F'], ['film-print-8', 'Ilford HP5 Plus'], ['film-print-9', 'Kodak Ektachrome E100'],
  ['film-print-10', 'Fujifilm Superia 1600'], ['film-print-11', 'Kodak Portra 160'], ['film-print-12', 'Kodak UltraMax 400'],
  ['film-print-13', 'Fujifilm Pro 400H'],
];
const CANISTERS = ['generic-color-negative', 'fujifilm-velvia50', 'kodak-400tx'];
const W = 800, H = 500, FULL = { x: 0, y: 0, w: W, h: H }, GATE = { x: 28, y: 54, w: 588, h: 392 }, GAP = 16;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, parent) => { const e = document.createElement(tag); Object.assign(e, attrs); parent && parent.appendChild(e); return e; };

// The film strip in the gate: the hero three side by side.
const strip = $('#strip');
const frames = FILMS.slice(0, 3).map(([f]) => { const d = el('div', { className: 'frame' }, strip); el('img', { src: `/renders/${f}.jpg` }, d); return d; });
// Every name the corner shows, one per line.
const names = $('#names');
FILMS.forEach(([, n]) => el('div', { textContent: n }, names));
// The picker: the camera, then the hero three, as the Film panel lists them.
const picker = $('#picker');
const cells = [];
{
  const c = el('div', { className: 'cell' }, picker); el('div', { className: 'lit' }, c);
  c.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 48 48" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linejoin="round"><rect x="7" y="15" width="34" height="23" rx="4"/><path d="M17 15l3-5h8l3 5"/><circle cx="24" cy="26.5" r="6.5"/></svg><div class="labels"></div>');
  cells.push(c);
}
FILMS.slice(0, 3).forEach(([, n], i) => {
  const c = el('div', { className: 'cell' }, picker); el('div', { className: 'lit' }, c);
  el('img', { src: `/stocks/${CANISTERS[i]}.svg` }, c);
  const l = el('div', { className: 'labels' }, c); el('div', { className: 'label', textContent: n }, l); el('div', { className: 'label on', textContent: n }, l);
  cells.push(c);
});
// The contact sheet: five across, three down; the negative first, the photo, then every film.
const GRID = ['film-negative', 'film-photo', ...FILMS.map(([f]) => f)];
const COLS = 5, TW = 144, TH = 96, TG = 10;
const gridX = (W - (COLS * TW + (COLS - 1) * TG)) / 2, gridY = (H - (3 * TH + 2 * TG)) / 2;
const tileRect = (i) => ({ x: gridX + (i % COLS) * (TW + TG), y: gridY + Math.floor(i / COLS) * (TH + TG), w: TW, h: TH });
const tiles = GRID.map((f) => { const b = el('div', { className: 'box' }, $('#grid')); el('img', { src: `/renders/${f}.jpg` }, b); return b; });

// Everything a frame shows, written by the timeline and drawn by `draw`.
const S = { box: { ...FULL }, zoom: 1.06, sweep: 0, negative: 1, advance: 0, cut: -1, name: 0, names: 0, picker: 0, grid: 0, tile0: 0 };
const place = (e, r) => Object.assign(e.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
const lerp = (a, b, t) => a + (b - a) * t;
const lerpRect = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) });
function draw() {
  const hero = $('#hero');
  place(hero, S.box);
  hero.style.borderRadius = lerp(0, 6, Math.min(1, Math.max(0, (W - S.box.w) / (W - GATE.w)))) + 'px';
  hero.style.opacity = S.grid >= 1 ? 0 : 1;
  const z = `scale(${S.zoom})`;
  $('#negative').style.transform = z;
  $('#negative').style.opacity = S.negative;
  // The scanner's head: past it, the print; before it, the negative.
  const head = S.sweep * S.box.w;
  strip.style.clipPath = S.negative > 0 ? `inset(0 ${S.box.w - head}px 0 0)` : 'none';
  $('#sweep').style.left = head + 'px';
  $('#sweep').style.opacity = S.sweep > 0 && S.sweep < 1 ? 1 : 0;
  frames.forEach((f, i) => {
    f.style.width = S.box.w + 'px';
    f.style.left = (i - S.advance) * (S.box.w + GAP) + 'px';
    f.firstChild.style.transform = z;
  });
  const cut = $('#cut');
  cut.style.display = S.cut >= 0 ? 'block' : 'none';
  if (S.cut >= 0) { const src = `/renders/${FILMS[Math.round(S.cut)][0]}.jpg`; if (!cut.src.endsWith(src)) cut.src = src; }
  [...names.children].forEach((n, i) => n.style.transform = `translateY(${-S.name * 20}px)`);
  names.style.opacity = S.names;
  picker.style.opacity = S.picker;
  picker.style.transform = `translateX(${(1 - S.picker) * 60}px)`;
  [...picker.children].forEach((c, i) => c.style.transform = `translateX(${Math.max(0, 1 - S.picker * 1.3 + i * 0.1) * 40}px)`);
  tiles.forEach((t, i) => {
    const r = i === 0 ? lerpRect(tileRect(0), { x: -W * 0.03, y: -H * 0.03, w: W * 1.06, h: H * 1.06 }, S.tile0) : tileRect(i);
    place(t, r);
    const from = (GRID.length - 1 - i) * 0.035;
    const shown = i === GRID.length - 1 ? (S.grid >= 1 ? 1 : 0) : Math.min(1, Math.max(0, (S.grid - from) / 0.3));
    t.style.opacity = i === 0 && S.tile0 > 0 ? 1 : shown;
    t.style.transform = `scale(${lerp(0.9, 1, shown)})`;
    t.style.zIndex = i === 0 ? 2 : 1;
  });
}

const tl = gsap.timeline({ paused: true, onUpdate: draw });
const lit = (i, on, at) => tl.to(cells[i].querySelectorAll('.lit, .label.on'), { opacity: on ? 1 : 0, duration: 0.18, ease: 'none' }, at);
const cellAt = (i) => { const r = cells[i].getBoundingClientRect(); return { x: r.left + r.width * 0.64, y: r.top + r.height * 0.4 }; };
const press = (at) => {
  tl.to('#hand svg', { scale: 0.86, duration: 0.08, ease: 'power1.out', transformOrigin: '2px 2px' }, at);
  tl.to('#hand svg', { scale: 1, duration: 0.18, ease: 'power1.out' }, at + 0.08);
  tl.fromTo('#ring', { scale: 0.4, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: 'power2.out', immediateRender: false }, at);
};
gsap.set('#hand', { x: 860, y: 560 });
gsap.set(cells[1].querySelectorAll('.lit, .label.on'), { opacity: 1 });

// 1. The negative, as it lies on the light table; the scanner's head reads it into Ektar's print.
let t = 0.7;
tl.to(S, { sweep: 1, duration: 1.3, ease: 'power2.inOut' }, t);
tl.to(S, { zoom: 1.0, duration: 1.6, ease: 'power2.inOut' }, t);
tl.set(S, { negative: 0 }, t + 1.3);
tl.to(S, { names: 1, duration: 0.3, ease: 'none' }, t + 1.2);
t += 1.6 + 0.6;
// 2. The print steps into the gate, the Film panel beside it; the hand picks the next films.
tl.to(S.box, { ...GATE, duration: 0.75, ease: 'power3.inOut' }, t);
tl.to(S, { picker: 1, duration: 0.75, ease: 'power3.out' }, t + 0.15);
tl.to('#hand', { x: cellAt(2).x, y: cellAt(2).y, duration: 0.75, ease: 'power3.out' }, t + 0.35);
t += 1.1;
[2, 3].forEach((cell) => {
  if (cell === 3) { tl.to('#hand', { x: cellAt(3).x, y: cellAt(3).y, duration: 0.5, ease: 'power3.inOut' }, t); t += 0.5; }
  press(t);
  lit(cell - 1, false, t); lit(cell, true, t);
  tl.to(S, { advance: cell - 1, duration: 0.85, ease: 'power4.inOut' }, t + 0.05);
  tl.to(S, { name: cell - 1, duration: 0.55, ease: 'power3.inOut' }, t + 0.3);
  t += 0.9 + 0.75;
});
// 3. The panel steps aside and the print fills the screen again; then every film, cut on the beat.
tl.to('#hand', { x: 860, y: 560, duration: 0.6, ease: 'power3.in' }, t - 0.3);
tl.to(S, { picker: 0, duration: 0.5, ease: 'power3.in' }, t);
tl.to(S.box, { ...FULL, duration: 0.75, ease: 'power3.inOut' }, t + 0.15);
t += 0.9 + 0.35;
for (let i = 3; i < FILMS.length; i++) {
  tl.set(S, { cut: i, name: i }, t);
  t += i < 5 ? 0.32 : i < 9 ? 0.22 : 0.17;
}
t += 0.45;
// 4. The last print settles into a contact sheet of every film; the negative comes forward and the roll begins again.
tl.to(S.box, { ...tileRect(GRID.length - 1), duration: 0.9, ease: 'power3.inOut' }, t);
tl.to(S, { names: 0, duration: 0.2, ease: 'none' }, t);
tl.to(S, { grid: 1, duration: 1.0, ease: 'power2.out' }, t + 0.25);
t += 1.25 + 0.9;
tl.to(S, { tile0: 1, duration: 1.0, ease: 'power3.inOut' }, t);
t += 1.0;
// Back to the first frame's state: the hero over the negative, the sheet gone.
tl.set(S, { grid: 0, tile0: 0, cut: -1, advance: 0, sweep: 0, negative: 1, name: 0, zoom: 1.06 }, t);
tl.set(S.box, { ...FULL }, t);
tl.set(cells[3].querySelectorAll('.lit, .label.on'), { opacity: 0 }, t);
tl.set(cells[1].querySelectorAll('.lit, .label.on'), { opacity: 1 }, t);
window.LENGTH = t;
// Each frame is taken once its pictures are decoded.
const decoded = () => Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
window.READY = decoded();
window.seek = async (s) => { tl.seek(s, false); draw(); await decoded(); };
draw();
</script>
</body>
</html>
