[package]
name = "oni-app"
description = "The desktop app shell of Open Negative Initiative in Slint: window, toolbar, panel, canvas and gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "oni"
path = "src/main.rs"

[[bin]]
name = "oni-tokens"
path = "src/bin/oni-tokens.rs"

[dependencies]
bytemuck.workspace = true
oni-core = { path = "../oni-core" }
oni-decode.workspace = true
oni-fixtures.workspace = true
oni-graph = { path = "../oni-graph" }
oni-library = { path = "../oni-library" }
oni-pipeline = { path = "../oni-pipeline" }
oni-settings.workspace = true
oni-ui-poc = { path = "../oni-ui-poc" }
pollster.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "backend-winit", "accessibility", "renderer-femtovg-wgpu", "unstable-wgpu-30"] }
wgpu.workspace = true

[dev-dependencies]
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"
