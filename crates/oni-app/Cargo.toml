[package]
name = "oni-app"
description = "The desktop app shell of Open Negative Initiative in Slint: window, toolbar, panel, canvas and gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "oni"
path = "src/main.rs"

[[bin]]
name = "oni-tokens"
path = "src/bin/oni-tokens.rs"

[dependencies]
arboard = { version = "3.6", default-features = false }
bytemuck.workspace = true
jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
oni-colour.workspace = true
oni-core = { path = "../oni-core" }
oni-decode.workspace = true
oni-export = { path = "../oni-export" }
oni-fixtures.workspace = true
oni-graph = { path = "../oni-graph" }
oni-library = { path = "../oni-library" }
oni-link = { path = "../oni-link" }
oni-measure = { path = "../oni-measure" }
oni-ui = { path = "../oni-ui" }
oni-pipeline = { path = "../oni-pipeline" }
oni-settings.workspace = true
pollster.workspace = true
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
base64 = "0.22"
# `ReportSeal`: a report's log sealed to the maintainers' X25519 key, as CryptoKit seals it.
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
# The paper makers' pages and files, checked against the system's trust store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# `Updates`: the appcast read, and each archive's EdDSA signature checked before it is kept.
roxmltree = "0.21"
ring = "0.17"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "backend-winit", "accessibility", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030"] }
tiff = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
wgpu.workspace = true

# The double-click interval, the dialogs and the Trash are the system's own; Linux runs the checks only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSWorkspace", "NSPasteboard", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSArray", "NSData", "NSUserDefaults"] }
rfd = { version = "0.17", default-features = false }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
oni-render = { path = "../oni-render" }
# The phone app's own side of the link, so the window check pairs as the phone does.
oni-link-ffi = { path = "../oni-link-ffi" }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
png = "0.18"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }


[[test]]
name = "window"
path = "tests/window/main.rs"
harness = false

[lib]
doctest = false
