[package]
name = "oni-link-demo"
description = "A stand-in desktop and phone for trying ONI Link from a terminal."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oni-link = { path = "../oni-link" }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["full"] }
oni-localsend = { path = "../oni-localsend" }
futures-util = "0.3"
