[package]
name = "oni-tldb"
description = "The Lens DB for Open Negative Initiative: a person's Kit of bodies and lenses, its partner API, its OAuth sign-in and a simulated service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oni-library = { path = "../oni-library" }
base64 = "0.22"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
oni-hack = { version = "0.1", path = "../oni-hack" }

[lib]
doctest = false
