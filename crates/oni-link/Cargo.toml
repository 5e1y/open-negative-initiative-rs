[package]
name = "oni-link"
description = "ONI's remote-control protocol: the scanner keypad from a phone, over any byte stream."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
oni-keys = { path = "../oni-keys" }
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
snow = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
doctest = false
