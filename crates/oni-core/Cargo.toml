[package]
name = "oni-core"
description = "The editing model of Open Negative Initiative: the open frame's store, its commands, undo, paste, presets and roll-wide gestures, headless"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
oni-settings.workspace = true
oni-library = { path = "../oni-library" }
oni-keys = { path = "../oni-keys" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
oni-hack = { version = "0.1", path = "../oni-hack" }

[dev-dependencies]
oni-fixtures.workspace = true

[lib]
doctest = false
