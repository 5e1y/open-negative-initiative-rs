[package]
name = "oni-demos"
description = "The help cards' demos: coded scenes of the real design system over the real render, filmed headless to GIF"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "oni-demos"
path = "src/main.rs"
test = false

[lib]
doctest = false

[dependencies]
color_quant = "1.1"
gif = "0.14"
oni-app = { path = "../oni-app" }
oni-colour.workspace = true
oni-core = { path = "../oni-core" }
oni-graph = { path = "../oni-graph" }
oni-i18n = { path = "../oni-i18n" }
oni-lab = { path = "../oni-lab" }
oni-pipeline = { path = "../oni-pipeline" }
oni-settings.workspace = true
png = "0.18"
weezl = "0.1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "backend-winit", "accessibility", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "accessibility", "display-diagnostics", "internal"] }
oni-hack = { version = "0.1", path = "../oni-hack" }
