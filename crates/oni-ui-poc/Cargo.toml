[package]
name = "oni-ui-poc"
description = "A Slint window with one keycap slider driving oni-render's stage 4-7 on a roll #8 frame"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oni-decode.workspace = true
oni-fixtures.workspace = true
oni-render.workspace = true
serde_json.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "backend-winit", "accessibility", "renderer-femtovg-wgpu", "unstable-wgpu-30"] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"
