[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
oni-colour = { path = "crates/oni-colour" }
oni-decode = { path = "crates/oni-decode" }
oni-fixtures = { path = "crates/oni-fixtures" }
oni-render = { path = "crates/oni-render" }
oni-settings = { path = "crates/oni-settings" }
bytemuck = { version = "1.25.2", features = ["derive"] }
lcms2 = "6"
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1

# Iteration: incremental, the workspace lightly optimised so the scalar references stay quick,
# every dependency fully; `--release` stays the shipped build.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
