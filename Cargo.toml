[workspace]
resolver = "3"
members = ["crates/*","crates/oni-hack"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
oni-colour = { path = "crates/oni-colour" }
oni-decode = { path = "crates/oni-decode" }
oni-fixtures = { path = "crates/oni-fixtures" }
oni-render = { path = "crates/oni-render" }
oni-settings = { path = "crates/oni-settings" }
bytemuck = { version = "1.25.2", features = ["derive"] }
lcms2 = "6"
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1

[profile.release.package.oni-ui]
debug = false

# The Slint compiler runs in the build script: optimised, it lays the interface in a quarter the time.
[profile.release.package.i-slint-compiler]
opt-level = 3

# Iteration: incremental, the workspace lightly optimised so the scalar references stay quick,
# every dependency fully; `--release` stays the shipped build.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Unpacked kept every object of every build, 47 GB in two days; none is read once linked.
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The generated interface: 44 MB of Rust; optimised, as the window checks run it 72 times, and edited
# through `scripts/live`, which needs no build.
[profile.dev.package.oni-ui]
opt-level = 1
debug = false
incremental = false

# The app as the owner runs it day to day: release's numbers, built incrementally in many units, so
# an edit relinks in seconds; `--release` stays the shipped build.
[profile.app]
inherits = "release"
incremental = true
codegen-units = 256
debug = "line-tables-only"
split-debuginfo = "off"

[profile.app.package.oni-ui]
opt-level = 1
debug = false

