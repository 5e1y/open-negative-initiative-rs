# Windows gives the main thread 1 MB of stack where macOS gives 8 MB, and Slint builds a window's tree
# on it: every Windows binary takes the Mac's 8 MB. The C runtime is linked in, so a bare PC runs the exe.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]
